<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Paused for focus</title><link rel="stylesheet" href="ui.css" />
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  main { max-width: 460px; text-align: center; }
  .ring { width: 160px; height: 160px; margin: 0 auto 22px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: var(--ink-2); }
  .row { justify-content: center; margin-top: 18px; }
  .host { color: var(--ink); font-weight: 700; }
</style></head>
<body><main>
  <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--lichen)" stroke-width="6" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="left" role="timer">--:--</b></div>
  <h1><span class="host" id="host">This site</span> <span id="why">is paused while you focus</span></h1>
  <p id="msg">It'll open again when your focus block ends.</p>
  <div class="row">
    <button class="primary" id="back">Back to work</button>
    <button id="allow">Open for 5 minutes</button>
  </div>
  <p class="muted" id="foot" style="margin-top:22px;font-size:12px">Paused by Synapse because a focus block is running. Change which sites pause in the extension's settings.</p>
</main><script src="blocked.js" type="module"></script></body>
</html>
