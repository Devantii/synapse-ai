# One-click deploy to Render: https://render.com/deploy?repo=https://github.com/Devantii/synapse-ai
#
# Creates the web service plus a free PostgreSQL database, so accounts and data survive restarts.
#
# FREE PLAN NOTES
# - Render's free Postgres expires 30 days after creation (14-day grace period to upgrade).
#   For a free database that doesn't expire, use Neon instead: see "Database" in README.md.
# - The free web service sleeps after ~15 minutes idle and wakes in ~30-60 s.
databases:
  - name: synapse-db
    plan: free
    databaseName: synapse
    user: synapse

services:
  - type: web
    name: synapse-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      # Optional: "Continue with Google". Paste your OAuth client ID in the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Optional: community moderation. Comma-separated usernames that get the Admin page.
      - key: ADMIN_USERNAMES
        sync: false
      # Optional: weekly email reports. SMTP_URL like smtps://USER:PASS@smtp-relay.brevo.com:465
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Lets the "Weekly email reports" GitHub workflow trigger sends (copy it into the repo secret CRON_SECRET).
      - key: CRON_SECRET
        generateValue: true
